# Ekosistem kategorileri.
# Anahtar (ör. `tekmer`) içerik dosyalarındaki `kategori:` alanında kullanılır.
# Renk: tokens.css'te `--c-<anahtar>` token'ı bulunmalı.
#
# ad                 çip, detay paneli ve listelerde görünen ad
# kisaAd             haritadaki dilim etiketi
# baslik / aciklama  aktör kategorisi sayfasının başlığı ve giriş metni (diğer sayfaların metni sayfalar/*.md)
# yol                kategorinin sayfası (/tekmerler); haritadaki kayıtlar bu sayfaya bağlanır
# sira               haritadaki dilim sırası
# menuAdi, menuSira  üst menüdeki adı ve sırası (menuSira yoksa kategori menüde yer almaz)
# firmaBasligi       aktörün `firmalar` listesinin başlığı (varsayılan: "Bu alandaki firmalar")
# yonetimBekleniyor  true ise yönetici bilgisi olmayan aktörde "bulunamadı" notu gösterilir

teknopark:
  ad: Teknopark
  kisaAd: Teknopark
  baslik: Teknoparklar
  aciklama: Ankara'daki teknoloji geliştirme bölgeleri (TGB).
  yol: teknoparklar
  sira: 1
  menuAdi: Teknoparklar
  menuSira: 4
  yonetimBekleniyor: true

tekmer:
