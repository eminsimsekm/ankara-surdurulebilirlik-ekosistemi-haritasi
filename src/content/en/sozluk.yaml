# İngilizce sözlük çevirileri. Türkçe sözlüklerin (kategoriler.yaml, alanlar.yaml, …) yerine geçmez,
# üzerine bindirilir: anahtarlar Türkçe dosyalardaki anahtarlardır. Yazılmayan değer Türkçe kalır.
#
# kategoriler / alanlar / yatirimTurleri / isbirligiTurleri   anahtar = sözlük kimliği
# oneCikanSayilar / sektorYatirimlari                          anahtar = one-cikan-sayilar.yaml / sektor-yatirimlari-2025.yaml kimliği
# unvanlar / birimler / etiketler                              anahtar = Türkçe değerin kendisi
#
# Etiketler: özel isim olanlar (AI Fest, LEAP Investment, TÜBİTAK 1071 TRANSMIT…) buraya yazılmaz, olduğu gibi kalır.
# Üniversite adları özel isim olduğu için çevrilmez.

