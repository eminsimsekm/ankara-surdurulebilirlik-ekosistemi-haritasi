# Geçici önizleme: main'e her push'ta site GitHub Pages'e yayınlanır.
# Asıl yayın Altun Hosting'de olacak; o zaman bu dosya silinebilir.
name: GitHub Pages önizleme

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run build
        env:
          # Ör. /ankara-surdurulebilirlik-ekosistemi-haritasi ; özel alan adında boş gelir
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_URL: ${{ steps.pages.outputs.origin }}
      # npm run build sorun özetini iş özetine de yazar (uyarılar iş akışını durdurmaz).
      # İç çıktılar (veri.xlsx/json/md) indirilebilir artifact; siteyle yayınlanmaz (WP-01 kararı).
      # Sitedeki genel Excel dist/indir/ altında; o yayınlanır.
      - uses: actions/upload-artifact@v4
        with:
          name: veri-ciktilari
          path: dist/veri
      - run: rm -rf dist/veri
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
